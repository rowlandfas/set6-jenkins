services:
  jenkins:
    build:
      context: ./jenkins
    container_name: local-jenkins
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app:/workspace/app
    restart: unless-stopped
 
volumes:
  jenkins-data:
